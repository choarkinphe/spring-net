[package]
name = "aonet"
version = "0.6.0"
edition = "2024"
description = "Local network diagnostics and authorized concurrency testing"
license = "MIT"

[dependencies]
axum = "0.7.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "test-util", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
async-stream = "0.3"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
httpdate = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[package]
name = "aonet-desktop"
version = "0.8.0"
edition = "2024"
description = "AoNet cross-platform desktop application"
license = "MIT"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

# Keep build-time proc macros loadable with the current macOS linker.
[profile.release.build-override]
debug = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aonet = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"

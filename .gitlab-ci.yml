stages:
  - verify
  - package

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  # Configure these tags on the project runners before enabling jobs.
  LINUX_RUNNER_TAG: "linux-x64"
  WINDOWS_RUNNER_TAG: "windows-x64"
  MACOS_ARM64_RUNNER_TAG: "macos-arm64"
  MACOS_X64_RUNNER_TAG: "macos-x64"
  BUILD_WINDOWS: "false"
  BUILD_MACOS_ARM64: "false"
  BUILD_MACOS_X64: "false"
  # Fresh job checkout; never reuse release output from a previous job.
  GIT_STRATEGY: clone
  CARGO_TERM_COLOR: "always"

verify:linux:
  stage: verify
  image: node:22-bookworm
  tags:
    - $LINUX_RUNNER_TAG
  script:
    - node scripts/ci-desktop.cjs verify-linux
  timeout: 15m

.package:
  stage: package
  needs: ["verify:linux"]
  timeout: 90m
  artifacts:
    name: "spring-net-$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    when: on_success
    paths:
      - ci-artifacts/

package:windows-x64:
  extends: .package
  tags:
    - $WINDOWS_RUNNER_TAG
  rules:
    - if: '$BUILD_WINDOWS == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)'
    - when: never
  script:
    - node scripts/ci-desktop.cjs windows-x64

package:macos-arm64:
  extends: .package
  tags:
    - $MACOS_ARM64_RUNNER_TAG
  rules:
    - if: '$BUILD_MACOS_ARM64 == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)'
    - when: never
  script:
    - node scripts/ci-desktop.cjs macos-arm64

package:macos-x64:
  extends: .package
  tags:
    - $MACOS_X64_RUNNER_TAG
  rules:
    - if: '$BUILD_MACOS_X64 == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)'
    - when: never
  script:
    - node scripts/ci-desktop.cjs macos-x64

name: Desktop build (manual, no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked local CLI
        run: npm ci
      - name: Core tests
        run: cargo test --locked
      - name: Frontend tests
        run: node --test web/*.test.cjs
      - name: Build Mac app
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AoNet-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
